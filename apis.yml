name: Adap.tv
description: Adap.tv was a global programmatic video advertising platform founded around 2007 and backed
  by Redpoint Ventures, offering brands, agencies, and publishers tools for planning, executing, and
  measuring video ad campaigns programmatically, including real-time bidding (RTB), audience targeting,
  campaign management, and analytics through its Pathway video-intelligence platform. AOL acquired Adap.tv
  in September 2013 for approximately $405 million and folded its technology into ONE by AOL; the business
  subsequently passed to Verizon Media and then Yahoo. Adap.tv no longer operates as an independent
  company and publishes no developer program, public API, or SDKs; the www.adap.tv domain now
  301-redirects to yahooinc.com. This profile is retained as a historical portfolio-lead record.
